# ============================================================
# MatrixFlow AI · 本地开发基础设施
# 启动: docker compose up -d
# 停止: docker compose down
# 清理数据: docker compose down -v
# ============================================================

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: mfa-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: matrixflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-matrixflow}
      POSTGRES_DB: matrixflow
      TZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./scripts/sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U matrixflow -d matrixflow"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: mfa-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: mfa-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-matrixflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-matrixflow123}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 创建 MinIO bucket（一次性初始化）
  minio-init:
    image: minio/mc:latest
    container_name: mfa-minio-init
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-matrixflow}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-matrixflow123}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD};
      mc mb -p local/matrixflow || true;
      echo 'MinIO bucket initialized';
      "
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfa-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      sidecar:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://matrixflow:matrixflow@postgres:5432/matrixflow}
      REDIS_URL: redis://redis:6379/0
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-matrixflow}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-matrixflow123}
      MINIO_BUCKET: matrixflow
      JWT_SECRET: dev-secret-32chars-minimum!
      PORT: "3001"
      NODE_ENV: development
      AUTH_MODE: appwrite
      APPWRITE_ENDPOINT: ${APPWRITE_ENDPOINT:-https://cloud.appwrite.io/v1}
      APPWRITE_PROJECT_ID: ${APPWRITE_PROJECT_ID:-}
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET:-local-development-internal-secret-change-me}
      SIDECAR_PYTHON_URL: http://sidecar:8001
    ports:
      - "3001:3001"
    command: ["sh", "-c", "pnpm --filter @matrixflow/db exec prisma migrate deploy --schema prisma/schema.prisma && node apps/api/dist/main.js"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/api/v1/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: mfa-worker
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      REDIS_URL: redis://redis:6379/0
      INTERNAL_API_URL: http://api:3001/api/v1
      INTERNAL_JOB_SECRET: ${INTERNAL_JOB_SECRET:-local-development-internal-secret-change-me}
      QUEUE_CONCURRENCY: 4
      NODE_ENV: development
    command: ["node", "apps/worker/dist/main.js"]

  sidecar:
    build:
      context: ./apps/sidecar
      dockerfile: Dockerfile
    container_name: mfa-sidecar
    restart: unless-stopped
    expose:
      - "8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 5

  mailhog:
    image: mailhog/mailhog:latest
    container_name: mfa-mailhog
    restart: unless-stopped
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # Web UI

volumes:
  pg_data:
  redis_data:
  minio_data:
  api_node_modules:

name: MatrixFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality + integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: postgresql://matrixflow:matrixflow@localhost:5432/matrixflow_test
    services:
      postgres:
        image: pgvector/pgvector:0.8.5-pg16-trixie
        env:
          POSTGRES_USER: matrixflow
          POSTGRES_PASSWORD: matrixflow
          POSTGRES_DB: matrixflow_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U matrixflow -d matrixflow_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7.4.9-alpine3.21
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: apps/sidecar/requirements.txt
      - run: pnpm install --frozen-lockfile
      - run: pip install --require-hashes -r apps/sidecar/requirements.txt
      - run: pnpm db:generate
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test:coverage
      - name: Python sidecar tests
        working-directory: apps/sidecar
        run: python -m unittest -v
      - name: API integration tests
        env:
          NODE_ENV: test
          AUTH_MODE: local
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          INTERNAL_JOB_SECRET: ci-only-internal-secret-at-least-32-characters
        run: |
          pnpm db:migrate
          pnpm --filter @matrixflow/api test:e2e
      - run: pnpm build
      - run: pnpm audit --prod --audit-level=high

  docker-build:
    name: image / ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            context: .
            file: infra/docker/api.Dockerfile
          - name: worker
            context: .
            file: infra/docker/worker.Dockerfile
          - name: sidecar
            context: apps/sidecar
            file: apps/sidecar/Dockerfile
          - name: combined
            context: .
            file: Dockerfile
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: runner
          push: false
          tags: matrixflow-${{ matrix.name }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

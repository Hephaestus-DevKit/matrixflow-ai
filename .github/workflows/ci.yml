name: MatrixFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: web + function
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install function dependencies
        working-directory: apps/functions/matrixflow-core
        run: npm ci
      - run: pnpm format:check
      - run: pnpm schema:check
      - run: pnpm i18n:check
      - name: Validate production configuration shape
        run: pnpm readiness:audit
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm function:check
      - run: pnpm function:test
      - run: pnpm audit --prod --audit-level=high
      - name: Audit function production dependencies
        working-directory: apps/functions/matrixflow-core
        run: npm audit --omit=dev --audit-level=high

  safari:
    name: Native Safari regression
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo safaridriver --enable
      - name: Use standard appearance for the desktop animation regression
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess increaseContrast -bool false
      - run: pnpm --filter @matrixflow/shared build
      - run: pnpm test:e2e
      - name: Upload Safari failure context
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: safari-failure-context
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

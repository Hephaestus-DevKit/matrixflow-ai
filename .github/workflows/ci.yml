name: MatrixFlow CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  quality:
    name: typecheck + lint + test
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://matrixflow:matrixflow@localhost:5432/matrixflow_test
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: matrixflow
          POSTGRES_PASSWORD: matrixflow
          POSTGRES_DB: matrixflow_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U matrixflow -d matrixflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - name: API integration tests
        env:
          NODE_ENV: test
          AUTH_MODE: local
          REDIS_URL: redis://localhost:6379/0
          JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
          INTERNAL_JOB_SECRET: ci-only-internal-secret-at-least-32-characters
        run: |
          pnpm db:migrate
          pnpm --filter @matrixflow/api test:e2e

  docker-build:
    name: docker build (api)
    runs-on: ubuntu-latest
    needs: quality
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v7
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: infra/docker/api.Dockerfile
          push: false
          tags: matrixflow-api:ci

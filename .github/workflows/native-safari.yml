name: Native Safari
on: [pull_request]
permissions:
  contents: read
jobs:
  safari:
    name: Native Safari regression
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6
        with:
          version: 11.9.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.14.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo safaridriver --enable
      - name: Use standard appearance for the desktop animation regression
        run: |
          defaults write com.apple.universalaccess reduceMotion -bool false
          defaults write com.apple.universalaccess increaseContrast -bool false
      - name: Build the web app against the isolated test API
        run: pnpm build
        env:
          NEXT_PUBLIC_APPWRITE_ENDPOINT: http://127.0.0.1:3102/v1
      - run: pnpm exec playwright test -c native.config.ts
      - name: Upload Safari failure context
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: safari-failure-context
          path: test-results/
          if-no-files-found: ignore
          retention-days: 3

name: Production smoke

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: production-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-surface:
    name: public surface
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22.14.0
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
        with:
          version: 11.9.0
      - name: Install smoke dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Verify smoke assertions
        run: node --test scripts/production-smoke.test.mjs
      - name: Check production pages and security headers
        env:
          MATRIXFLOW_PRODUCTION_URL: https://matrixflow-ai-sycamore-tree.vercel.app
        run: node scripts/production-smoke.mjs

version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
    groups:
      node-production:
        dependency-type: production
      node-development:
        dependency-type: development
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
